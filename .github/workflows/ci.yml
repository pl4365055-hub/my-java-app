name: Java CI with Maven

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: build with Maven
        run: mvn compile

      - name: Run Unit Tests
        run: mvn test

      # 範例：將 Maven 打包出來的 JAR 檔上傳為 Artifact
      - name: Package with Maven
        run: mvn package -DskipTests # 產生 target/*.jar

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app-jar
          path: target/*.jar
          retention-days: 7 # 設定保存天數